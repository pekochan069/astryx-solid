name: Parity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: cd apps/docs && bun x playwright install --with-deps chromium firefox webkit
      - run: bun run parity
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-reports
          path: artifacts/
