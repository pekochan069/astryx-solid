name: Publish build package

on:
  push:
    tags: ["build-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag commit
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify package tag
        run: test "${GITHUB_REF_NAME#build-v}" = "$(bun -p 'require("./packages/build/package.json").version')"
      - run: bun run parity --package @astryx-solid/build
      - name: Pack verified package
        run: |
          mkdir -p artifacts/publish
          cd packages/build
          bun pm pack --destination "$GITHUB_WORKSPACE/artifacts/publish" --ignore-scripts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-release
          path: artifacts/

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-release
          path: artifacts/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish package
        run: |
          VERSION="${GITHUB_REF_NAME#build-v}"
          npm view "@astryx-solid/build@$VERSION" version >/dev/null 2>&1 ||
            npm publish "artifacts/publish/astryx-solid-build-$VERSION.tgz" --provenance --access public --ignore-scripts
