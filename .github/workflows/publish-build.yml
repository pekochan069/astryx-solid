name: Publish build package

on:
  push:
    tags: ["build-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify package tag
        run: test "${GITHUB_REF_NAME#build-v}" = "$(bun -p 'require("./packages/build/package.json").version')"
      - run: bun run parity --package @astryx-solid/build
      - name: Publish package
        run: |
          VERSION="${GITHUB_REF_NAME#build-v}"
          npm view "@astryx-solid/build@$VERSION" version >/dev/null 2>&1 ||
            npm publish --workspace packages/build --provenance --access public
